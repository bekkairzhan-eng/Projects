<!doctype html>
<html class="light" lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BILife - Корпоративный портал</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        font-size: 24px;
        line-height: 1;
        display: inline-block;
        vertical-align: middle;
      }
      body { font-family: 'Inter', sans-serif; background-color: #f8f6f2; }
      input::placeholder { color: rgba(255,255,255,0.5); }
      .custom-scrollbar::-webkit-scrollbar { width: 6px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: #E2E8F0; border-radius: 10px; }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #CBD5E1; }
    </style>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-surface": "#1a1b22",
              "surface-variant": "#e5e3de",
              "secondary-container": "#e0deda",
              "on-secondary-container": "#5c5b57",
              "on-primary": "#ffffff",
              "on-primary-container": "#7a9aff",
              "error": "#ba1a1a",
              "on-error": "#ffffff",
              "on-surface-variant": "#4a4955",
              "outline-variant": "#d0cdc7",
              "surface-container": "#efede8",
              "surface": "#fdfcf9",
              "surface-dim": "#d8d5cf",
              "secondary": "#5c5b57",
              "surface-container-high": "#e8e5df",
              "tertiary": "#4f1100",
              "primary": "#002068",
              "surface-container-low": "#f5f3ee",
              "primary-container": "#003399",
              "background": "#f8f6f2",
              "outline": "#6e6d78",
              "on-background": "#1a1b22"
            },
            spacing: {
              "container-padding": "32px"
            }
          }
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
